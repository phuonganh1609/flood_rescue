# Resource Paths

listResources:
  operationId: listResources
  tags:
    - Resources
  summary: List resources
  description: Get list of available resources/vehicles (Manager, Coordinator only)
  parameters:
    - $ref: "#/components/parameters/page"
    - $ref: "#/components/parameters/limit"
    - $ref: "#/components/parameters/status"
    - $ref: "#/components/parameters/sortBy"
  responses:
    "200":
      description: List of resources
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: "#/components/schemas/ResourceList"
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

createResource:
  operationId: createResource
  tags:
    - Resources
  summary: Create resource
  description: Manager creates a new resource/vehicle
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ResourceCreate"
  responses:
    "201":
      $ref: "#/components/responses/Created"
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  resourceId:
                    type: string
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

updateResource:
  operationId: updateResource
  tags:
    - Resources
  summary: Update resource status
  description: Manager updates resource status
  parameters:
    - $ref: "#/components/parameters/id"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/ResourceUpdate"
  responses:
    "200":
      $ref: "#/components/responses/Success"
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "404":
      $ref: "#/components/responses/NotFound"
    "500":
      $ref: "#/components/responses/ServerError"
    summary: List resources
    description: Get list of available resources/vehicles (Manager, Coordinator only)
    parameters:
      - $ref: "#/components/parameters/page"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/sortBy"
    responses:
      "200":
        description: List of resources
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: "#/components/schemas/ResourceList"
                pagination:
