# Placeholder paths for future implementation
# These are referenced in openapi.yaml but not yet fully documented

# Users Paths (Admin only)
listUsers:
  operationId: listUsers
  tags:
    - Users
  summary: List users (Admin)
  description: Get list of all system users (Admin only)
  responses:
    "200":
      description: List of users
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

updateUserRole:
  operationId: updateUserRole
  tags:
    - Users
  summary: Update user role (Admin)
  description: Update user's role and permissions (Admin only)
  parameters:
    - $ref: "#/components/parameters/id"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            roleId:
              type: string
          required: [roleId]
  responses:
    "200":
      $ref: "#/components/responses/Success"
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "404":
      $ref: "#/components/responses/NotFound"
    "500":
      $ref: "#/components/responses/ServerError"

# Reports Paths
getSummaryReport:
  operationId: getSummaryReport
  tags:
    - Reports
  summary: Get summary report
  description: Get system summary report (Admin/Manager only)
  responses:
    "200":
      description: Summary report
      content:
        application/json:
          schema:
            type: object
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

exportReport:
  operationId: exportReport
  tags:
    - Reports
  summary: Export report as CSV
  description: Export system report in CSV format (Admin only)
  responses:
    "200":
      description: CSV file
      content:
        text/csv:
          schema:
            type: string
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

