# Request Paths

listRequests:
  operationId: listPendingRequests
  tags:
    - Requests
  summary: List pending requests
  description: Retrieve list of pending SOS requests (Coordinator only)
  parameters:
    - $ref: "#/components/parameters/page"
    - $ref: "#/components/parameters/limit"
    - $ref: "#/components/parameters/status"
    - $ref: "#/components/parameters/priority"
    - $ref: "#/components/parameters/sortBy"
  responses:
    "200":
      description: List of pending requests
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: "#/components/schemas/RequestList"
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "500":
      $ref: "#/components/responses/ServerError"

createRequest:
  operationId: createRequest
  tags:
    - Requests
  summary: Create rescue/relief request
  description: Submit a new rescue or relief request
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/components/schemas/RequestCreate"
  responses:
    "201":
      $ref: "#/components/responses/Created"
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  requestId:
                    type: string
    "400":
      $ref: "#/components/responses/BadRequest"
    "500":
      $ref: "#/components/responses/ServerError"
  security: []

myRequests:
  operationId: getMyRequests
  tags:
    - Requests
  summary: Get my requests
  description: Retrieve citizen's own rescue requests
  parameters:
    - $ref: "#/components/parameters/page"
    - $ref: "#/components/parameters/limit"
    - $ref: "#/components/parameters/status"
    - $ref: "#/components/parameters/sortBy"
  responses:
    "200":
      description: User's requests
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: "#/components/schemas/RequestList"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "500":
      $ref: "#/components/responses/ServerError"

getRequest:
  operationId: getRequestDetail
  tags:
    - Requests
  summary: Get request details
  description: Retrieve detailed information about a specific request
  parameters:
    - $ref: "#/components/parameters/id"
  responses:
    "200":
      description: Request details
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: "#/components/schemas/Request"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "404":
      $ref: "#/components/responses/NotFound"
    "500":
      $ref: "#/components/responses/ServerError"

verifyRequest:
  operationId: verifyRequest
  tags:
    - Requests
  summary: Verify or mark request as spam
  description: Coordinator verifies request legitimacy or marks as spam
  parameters:
    - $ref: "#/components/parameters/id"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              enum: [Verified, Spam]
          required: [status]
  responses:
    "200":
      $ref: "#/components/responses/Success"
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "404":
      $ref: "#/components/responses/NotFound"
    "500":
      $ref: "#/components/responses/ServerError"

setPriority:
  operationId: setRequestPriority
  tags:
    - Requests
  summary: Set request priority level
  description: Coordinator sets priority level for a request
  parameters:
    - $ref: "#/components/parameters/id"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            priority:
              type: string
              enum: [Low, Medium, High, Critical]
          required: [priority]
  responses:
    "200":
      $ref: "#/components/responses/Success"
    "400":
      $ref: "#/components/responses/BadRequest"
    "401":
      $ref: "#/components/responses/Unauthorized"
    "403":
      $ref: "#/components/responses/Forbidden"
    "404":
      $ref: "#/components/responses/NotFound"
    "500":
      $ref: "#/components/responses/ServerError"

