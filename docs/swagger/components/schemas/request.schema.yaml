# Rescue/Relief Request Schemas

Request:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    type:
      type: string
      enum: [Rescue, Relief]
      example: Rescue
    lat:
      type: number
      format: float
      minimum: -90
      maximum: 90
      example: 21.0285
    lng:
      type: number
      format: float
      minimum: -180
      maximum: 180
      example: 105.8542
    description:
      type: string
      maxLength: 1000
      example: People trapped on roof, need urgent help
    media:
      type: array
      items:
        type: string
        format: uri
      example: ["https://example.com/image1.jpg"]
    status:
      type: string
      enum: [Pending, Verified, In Progress, Completed, Cancelled, Spam]
      example: Pending
    priority:
      type: string
      enum: [Low, Medium, High, Critical]
      nullable: true
      example: High
    createdBy:
      type: string
      example: 507f1f77bcf86cd799439011
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required: [id, type, lat, lng, description, status, createdBy, createdAt]

RequestCreate:
  type: object
  properties:
    type:
      type: string
      enum: [Rescue, Relief]
      example: Rescue
    lat:
      type: number
      format: float
      example: 21.0285
    lng:
      type: number
      format: float
      example: 105.8542
    description:
      type: string
      maxLength: 1000
      example: People trapped on roof
    media:
      type: array
      items:
        type: string
        format: uri
      nullable: true
  required: [type, lat, lng, description]

RequestUpdate:
  type: object
  properties:
    status:
      type: string
      enum: [Pending, Verified, In Progress, Completed, Cancelled, Spam]
    priority:
      type: string
      enum: [Low, Medium, High, Critical]
  minProperties: 1

RequestList:
  type: array
  items:
    $ref: "#/components/schemas/Request"
