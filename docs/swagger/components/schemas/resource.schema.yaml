# Resource/Vehicle Schemas

Resource:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    name:
      type: string
      example: Rescue Boat 01
    type:
      type: string
      enum: [Boat, Vehicle, Equipment, Helicopter, Other]
      example: Boat
    capacity:
      type: integer
      minimum: 0
      example: 10
      description: Capacity in persons or units
    status:
      type: string
      enum: [Available, In Use, Maintenance, Out of Service]
      example: Available
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required: [id, name, type, capacity, status]

ResourceCreate:
  type: object
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 100
      example: Rescue Boat 01
    type:
      type: string
      enum: [Boat, Vehicle, Equipment, Helicopter, Other]
    capacity:
      type: integer
      minimum: 1
      example: 10
  required: [name, type, capacity]

ResourceUpdate:
  type: object
  properties:
    status:
      type: string
      enum: [Available, In Use, Maintenance, Out of Service]
      example: In Use
  required: [status]

ResourceList:
  type: array
  items:
    $ref: "#/components/schemas/Resource"
