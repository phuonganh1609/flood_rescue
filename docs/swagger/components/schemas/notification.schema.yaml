# Notification Schemas

Notification:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    userId:
      type: string
      example: 507f1f77bcf86cd799439011
    message:
      type: string
      maxLength: 500
      example: Your rescue request has been verified
    type:
      type: string
      enum: [RequestStatus, MissionUpdate, SystemAlert, General]
      example: RequestStatus
    read:
      type: boolean
      example: false
    relatedId:
      type: string
      nullable: true
      example: 507f1f77bcf86cd799439011
      description: Related resource ID (requestId, missionId, etc)
    createdAt:
      type: string
      format: date-time
  required: [id, userId, message, type, read, createdAt]

NotificationUpdate:
  type: object
  properties:
    read:
      type: boolean
      example: true
  required: [read]

NotificationList:
  type: array
  items:
    $ref: "#/components/schemas/Notification"
