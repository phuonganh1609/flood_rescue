# Mission Schemas

Mission:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    teamId:
      type: string
      example: 507f1f77bcf86cd799439011
    requestIds:
      type: array
      items:
        type: string
      example: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439012"]
    vehicleId:
      type: string
      nullable: true
      example: 507f1f77bcf86cd799439011
    status:
      type: string
      enum: [Assigned, In Progress, On Site, Completed, Cancelled]
      example: Assigned
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required: [id, teamId, requestIds, status, createdAt]

MissionCreate:
  type: object
  properties:
    teamId:
      type: string
      example: 507f1f77bcf86cd799439011
    requestIds:
      type: array
      items:
        type: string
      minItems: 1
    vehicleId:
      type: string
      nullable: true
  required: [teamId, requestIds]

MissionUpdate:
  type: object
  properties:
    status:
      type: string
      enum: [Assigned, In Progress, On Site, Completed, Cancelled]
      example: In Progress
  required: [status]

Position:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    missionId:
      type: string
      example: 507f1f77bcf86cd799439011
    lat:
      type: number
      format: float
      example: 21.0285
    lng:
      type: number
      format: float
      example: 105.8542
    timestamp:
      type: string
      format: date-time
  required: [id, missionId, lat, lng, timestamp]

PositionCreate:
  type: object
  properties:
    missionId:
      type: string
    lat:
      type: number
      format: float
    lng:
      type: number
      format: float
  required: [missionId, lat, lng]

MissionReport:
  type: object
  properties:
    id:
      type: string
      example: 507f1f77bcf86cd799439011
    missionId:
      type: string
      example: 507f1f77bcf86cd799439011
    summary:
      type: string
      maxLength: 2000
      example: All civilians rescued safely. Team returned to base.
    obstacles:
      type: string
      maxLength: 2000
      nullable: true
      example: Heavy water flow, limited visibility
    createdAt:
      type: string
      format: date-time
  required: [id, missionId, summary, createdAt]

MissionReportCreate:
  type: object
  properties:
    summary:
      type: string
      maxLength: 2000
    obstacles:
      type: string
      maxLength: 2000
      nullable: true
  required: [summary]

MissionList:
  type: array
  items:
    $ref: "#/components/schemas/Mission"
