# Reusable Parameters

id:
  name: id
  in: path
  required: true
  description: Resource ID (UUID or ObjectId)
  schema:
    type: string
  example: 507f1f77bcf86cd799439011

page:
  name: page
  in: query
  required: false
  description: Page number for pagination (default 1)
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1

limit:
  name: limit
  in: query
  required: false
  description: Number of items per page (default 10, max 100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
  example: 10

status:
  name: status
  in: query
  required: false
  description: Filter by status
  schema:
    type: string
    enum:
      - Pending
      - In Progress
      - Completed
      - Cancelled
  example: Pending

priority:
  name: priority
  in: query
  required: false
  description: Filter by priority level
  schema:
    type: string
    enum:
      - Low
      - Medium
      - High
      - Critical
  example: High

sortBy:
  name: sortBy
  in: query
  required: false
  description: Sort field (prefix with - for descending, e.g., -createdAt)
  schema:
    type: string
  example: -createdAt

Authorization:
  name: Authorization
  in: header
  required: true
  description: Bearer token for authentication
  schema:
    type: string
    pattern: "^Bearer [a-zA-Z0-9._-]+$"
  example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
