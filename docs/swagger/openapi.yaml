openapi: 3.0.0

info:
  title: Flood Rescue & Relief System API
  description: |
    API for managing rescue operations and relief distribution during flood disasters.

    **Key Features:**
    - User authentication and role-based access control
    - Rescue request management and verification
    - Mission assignment and tracking
    - Real-time team positioning
    - Resource and supply management
    - Notifications system
    - System reports and analytics
  version: 1.0.0
  contact:
    name: API Support
    email: support@floodrescue.local
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://api.floodrescue.local/api
    description: Production server

tags:
  $ref: ./tags.yaml

paths:
  # Auth endpoints
  /auth/login:
    post:
      $ref: ./paths/auth.yaml#/login
  /auth/register:
    post:
      $ref: ./paths/auth.yaml#/register
  /auth/me:
    get:
      $ref: ./paths/auth.yaml#/me

  # Requests endpoints
  /requests:
    get:
      $ref: ./paths/requests.yaml#/listRequests
    post:
      $ref: ./paths/requests.yaml#/createRequest
  /requests/my:
    get:
      $ref: ./paths/requests.yaml#/myRequests
  /requests/{id}:
    get:
      $ref: ./paths/requests.yaml#/getRequest
  /requests/{id}/verify:
    patch:
      $ref: ./paths/requests.yaml#/verifyRequest
  /requests/{id}/priority:
    patch:
      $ref: ./paths/requests.yaml#/setPriority
  /requests/{id}/confirm:
    patch:
      $ref: ./paths/requests.yaml#/confirmRequest

  # Missions endpoints
  /missions:
    post:
      $ref: ./paths/missions.yaml#/createMission
  /missions/assigned:
    get:
      $ref: ./paths/missions.yaml#/getAssignedMissions
  /missions/{id}:
    get:
      $ref: ./paths/missions.yaml#/getMissionDetail
  /missions/{id}/reassign:
    patch:
      $ref: ./paths/missions.yaml#/reassignMission
  /missions/{id}/status:
    patch:
      $ref: ./paths/missions.yaml#/updateMissionStatus
  /missions/{id}/report:
    post:
      $ref: ./paths/missions.yaml#/submitMissionReport
  /missions/{id}/positions:
    get:
      $ref: ./paths/missions.yaml#/getMissionPositions

  # Team Position endpoint
  /team-positions:
    post:
      $ref: ./paths/missions.yaml#/sendTeamPosition

  # Resources endpoints
  /resources:
    get:
      $ref: ./paths/resources.yaml#/listResources
    post:
      $ref: ./paths/resources.yaml#/createResource
  /resources/{id}:
    patch:
      $ref: ./paths/resources.yaml#/updateResource

  # Notifications endpoints
  /notifications:
    get:
      $ref: ./paths/notifications.yaml#/listNotifications
  /notifications/{id}/read:
    patch:
      $ref: ./paths/notifications.yaml#/markNotificationRead

  # Users endpoints (placeholder)
  /users:
    get:
      $ref: ./paths/system.yaml#/listUsers
  /users/{id}/role:
    patch:
      $ref: ./paths/system.yaml#/updateUserRole

  # Reports endpoints (placeholder)
  /reports/summary:
    get:
      $ref: ./paths/system.yaml#/getSummaryReport
  /reports/export:
    get:
      $ref: ./paths/system.yaml#/exportReport
  /system/categories:
    get:
      $ref: ./paths/system.yaml#/getCategories

components:
  securitySchemes:
    $ref: ./components/security.yaml

  responses:
    $ref: ./components/responses.yaml

  parameters:
    $ref: ./components/parameters.yaml

  schemas:
    $ref: ./components/schemas/index.yaml

security:
  - BearerAuth: []
