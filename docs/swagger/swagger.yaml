              schema:
                $ref: "#/components/schemas/Error"

  /api/reports/summary:
    get:
      tags:
        - Reports
      summary: Get summary report
      description: Get summary statistics and reports (Admin/Manager only)
      operationId: getSummaryReport
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Report retrieved successfully
          content:
            application/json:
