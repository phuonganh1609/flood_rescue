        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - userName
        - displayName
        - email
        - password
      properties:
        userName:
          type: string
          minLength: 3
          maxLength: 50
          example: "nguyenvana"
        displayName:
          type: string
          minLength: 2
          maxLength: 100
          example: "Nguyen Van A"
        email:
          type: string
          format: email
          example: "nguyenvana@example.com"
        phoneNumber:
          type: string
          pattern: "^[0-9]{10,11}$"
          example: "0901234567"
          description: "Optional phone number"
        password:
          type: string
          minLength: 6
          maxLength: 100
          example: "password123"
        role:
          type: string
          enum:
            - Citizen
            - Rescue Team
            - Rescue Coordinator
            - Manager
            - Admin
          default: Citizen

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "nguyenvana@example.com"
        password:
          type: string
          example: "password123"

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a1"
        userName:
          type: string
          example: "nguyenvana"
        displayName:
          type: string
          example: "Nguyen Van A"
        email:
          type: string
          example: "nguyenvana@example.com"
        phoneNumber:
          type: string
          example: "0901234567"
        avatarUrl:
          type: string
          example: "https://cloudinary.com/avatar.jpg"
        avatarId:
          type: string
          example: "avatar_public_id"
        isActive:
          type: boolean
          example: true
        role:
          type: string
          enum:
            - Citizen
            - Rescue Team
            - Rescue Coordinator
            - Manager
            - Admin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRescueTeamRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "Team Alpha"
        status:
          type: string
          enum:
            - Active
            - Offline
            - Busy
          default: Active

    AddTeamMemberRequest:
      type: object
      required:
        - memberName
        - teamName
      properties:
        memberName:
          type: string
          example: "Nguyen Van B"
        teamName:
          type: string
          example: "Team Alpha"
        memberRole:
          type: string
          enum:
            - Leader
            - Member
            - Driver
            - Medic
          default: Member

    CreateRequestInput:
      type: object
      required:
        - type
        - latitude
        - longitude
        - description
      properties:
        type:
          type: string
          enum:
            - Rescue
            - Relief
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.762622
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.660172
        description:
          type: string
          minLength: 10
          maxLength: 500
          example: "Trapped in flooded house, need immediate rescue"
        requestSupply:
          type: string
          maxLength: 200
          example: "Food, water, first aid kit"
        requestMedia:
          type: string
          format: uri
          example: "https://example.com/image.jpg"

    Request:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a3"
        userName:
          type: string
          example: "Nguyen Van A"
        type:
          type: string
          enum:
            - Rescue
            - Relief
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        description:
          type: string
        priority:
          type: string
          enum:
            - Critical
            - High
            - Normal
        status:
          type: string
          enum:
            - Pending
            - Verified
            - Assigned
            - InProgress
            - Completed
            - Cancelled
            - Spam
        requestSupply:
          type: array
          items:
            type: string
        requestMedia:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMissionRequest:
      type: object
      required:
        - teamId
        - requestIds
      properties:
        teamId:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a2"
        requestIds:
          type: array
          items:
            type: string
          example: ["60d5ec49f1b2c8b1f8e4e1a3"]
        vehicleId:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a6"

    Mission:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a4"
        teamId:
          type: string
        requestIds:
          type: array
          items:
            type: string
        vehicleId:
          type: string
        status:
          type: string
          enum:
            - Assigned
            - InProgress
            - Completed
            - Cancelled
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Position:
      type: object
      properties:
        missionId:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a4"
        latitude:
          type: number
          format: double
          example: 10.762622
        longitude:
          type: number
          format: double
          example: 106.660172
        timestamp:
          type: string
          format: date-time

    Resource:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a6"
        name:
          type: string
          example: "Rescue Boat #1"
        type:
          type: string
          enum:
            - Boat
            - Truck
            - Ambulance
            - Helicopter
            - Equipment
        capacity:
          type: integer
          example: 10
        status:
          type: string
          enum:
            - Available
            - In Use
            - Maintenance
            - Unavailable
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Supply:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a7"
        name:
          type: string
          example: "Water Bottles"
        quantity:
          type: integer
          example: 1000
        unit:
          type: string
          example: "bottles"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a8"
        userId:
          type: string
        title:
          type: string
          example: "New Mission Assigned"
        message:
          type: string
          example: "You have been assigned to Mission #123"
        type:
          type: string
          enum:
            - Info
            - Warning
            - Success
            - Error
        isRead:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ec49f1b2c8b1f8e4e1a9"
        name:
          type: string
          example: "Emergency Types"
        values:
          type: array
          items:
            type: string

    SummaryReport:
      type: object
      properties:
        totalRequests:
          type: integer
          example: 150
        pendingRequests:
          type: integer
          example: 20
        completedMissions:
          type: integer
          example: 100
        activeTeams:
          type: integer
          example: 10
        totalResourcesUsed:
          type: integer
          example: 45

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "An error occurred"
        code:
          type: string
          example: "ERROR_CODE"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token authentication. Format: `Bearer <token>`"
