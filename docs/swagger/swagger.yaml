openapi: 3.0.4
info:
  title: Flood Rescue & Relief System API
  description: |-
    API documentation for Flood Rescue & Relief Management System.

    This system manages rescue and relief operations during flood emergencies, including:
    - User authentication and authorization
    - Emergency rescue/relief requests
    - Mission assignment and tracking
    - Resource and inventory management
    - Real-time team position tracking
    - Notifications and reporting

    **Roles:**
    - Citizen: Can submit requests and view their status
    - Rescue Team: Receives and executes missions
    - Rescue Coordinator: Manages requests and assigns missions
    - Manager: Manages resources and inventory
    - Admin: Full system access

    **Production Server:** https://flood-rescue.onrender.com
  contact:
    email: duylase184704@fpt.edu.vn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
  - url: https://flood-rescue.onrender.com
    description: Production server
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Auth
    description: Authentication and user management
  - name: Requests
    description: Rescue and relief request operations
  - name: Missions
    description: Mission management and tracking
  - name: Teams
    description: Rescue team management
  - name: Resources
    description: Vehicle and equipment management
  - name: Inventory
    description: Relief supplies and inventory management
  - name: Notifications
    description: System notifications
  - name: Reports
    description: Reporting and analytics
  - name: Admin
    description: Administrative operations
  - name: System
    description: System configuration and settings

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register new user account
      description: Register a new user account (default role is Citizen)
      operationId: register
      requestBody:
        description: User registration information
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đăng ký thành công"
                  userId:
                    type: string
                    example: "60d5ec49f1b2c8b1f8e4e1a1"
        "400":
          description: Invalid input or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: |-
        Login to the system with email and password.
        Returns access token in response body and refresh token in HTTP-only cookie.
      operationId: login
      requestBody:
        description: Login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful. Refresh token is set in HTTP-only cookie.
          headers:
            Set-Cookie:
              description: HTTP-only cookie containing refresh token (7 days)
              schema:
                type: string
                example: refreshToken=abc123...; HttpOnly; Secure; SameSite=Strict; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        Refresh access token bằng refresh token lưu trong HTTP-only cookie. Không cần Authorization header.
      operationId: refreshToken
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          description: Refresh token được set trong cookie khi đăng nhập
          schema:
            type: string
      responses:
        "200":
          description: Refresh thành công, trả về access token mới
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Refresh token không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user information
      description: Get information of currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: |-
        Logout user by deleting refresh token from database and clearing cookie.
        Requires refresh token in HTTP-only cookie.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logout successful. Cookie is cleared.
        "400":
          description: No refresh token found in cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests:
    get:
      tags:
        - Requests
      summary: List all requests
      description: Get list of rescue/relief requests (can filter by status)
      operationId: listRequests
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by request status
          required: false
          schema:
            type: string
            enum:
              - Pending
              - Verified
              - Assigned
              - InProgress
              - Completed
              - Cancelled
              - Spam
        - name: type
          in: query
          description: Filter by request type
          required: false
          schema:
            type: string
            enum:
              - Rescue
              - Relief
        - name: priority
          in: query
          description: Filter by priority level
          required: false
          schema:
            type: string
            enum:
              - Critical
              - High
              - Normal
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Requests retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Request"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/my:
    get:
      tags:
        - Requests
      summary: Get my requests
      description: Get all requests submitted by current user (Citizen)
      operationId: getMyRequests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requests retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/{id}:
    get:
      tags:
        - Requests
      summary: Get request detail
      description: Get detailed information about a specific request
      operationId: getRequestDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Request ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/{id}/verify:
    patch:
      tags:
        - Requests
      summary: Verify request
      description: Verify or mark request as spam (Coordinator only)
      operationId: verifyRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Request ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - Verified
                    - Spam
              required:
                - status
      responses:
        "200":
          description: Request verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/{id}/priority:
    patch:
      tags:
        - Requests
      summary: Set request priority
      description: Set priority level for a request (Coordinator only)
      operationId: setRequestPriority
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Request ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: string
                  enum:
                    - Critical
                    - High
                    - Normal
              required:
                - priority
      responses:
        "200":
          description: Priority updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/requests/{id}/confirm:
    patch:
      tags:
        - Requests
      summary: Confirm safety or receipt
      description: Citizen confirms they are safe or received relief supplies
      operationId: confirmRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Request ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - not request owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions:
    post:
      tags:
        - Missions
      summary: Create mission
      description: Create a new rescue mission and assign to a team (Coordinator only)
      operationId: createMission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionRequest"
      responses:
        "201":
          description: Mission created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  missionId:
                    type: string
                    example: "60d5ec49f1b2c8b1f8e4e1a4"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/assigned:
    get:
      tags:
        - Missions
      summary: Get assigned missions
      description: Get missions assigned to current user's rescue team
      operationId: getAssignedMissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Missions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mission"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/{id}:
    get:
      tags:
        - Missions
      summary: Get mission detail
      description: Get detailed information about a specific mission
      operationId: getMissionDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Mission ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mission detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/{id}/reassign:
    patch:
      tags:
        - Missions
      summary: Reassign mission
      description: Reassign mission to a different team (Coordinator only)
      operationId: reassignMission
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Mission ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId:
                  type: string
                  example: "60d5ec49f1b2c8b1f8e4e1a2"
              required:
                - teamId
      responses:
        "200":
          description: Mission reassigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/{id}/status:
    patch:
      tags:
        - Missions
      summary: Update mission status
      description: Update the status of a mission (Rescue Team only)
      operationId: updateMissionStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Mission ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - Assigned
                    - InProgress
                    - Completed
                    - Cancelled
              required:
                - status
      responses:
        "200":
          description: Mission status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - not assigned team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/{id}/report:
    post:
      tags:
        - Missions
      summary: Submit mission report
      description: Submit report after completing a mission (Rescue Team only)
      operationId: submitMissionReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Mission ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  example: "Successfully rescued 5 people from flood area"
                obstacles:
                  type: string
                  example: "Road partially blocked, had to use alternate route"
              required:
                - summary
      responses:
        "201":
          description: Report submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    example: "60d5ec49f1b2c8b1f8e4e1a5"
        "403":
          description: Forbidden - not assigned team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/missions/{id}/positions:
    get:
      tags:
        - Missions
      summary: Get mission positions
      description: Get real-time position updates for a mission's rescue team
      operationId: getMissionPositions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Mission ID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/team-positions:
    post:
      tags:
        - Missions
      summary: Send team position
      description: Send real-time position update of rescue team (Rescue Team only)
      operationId: sendTeamPosition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missionId:
                  type: string
                  example: "60d5ec49f1b2c8b1f8e4e1a4"
                latitude:
                  type: number
                  format: double
                  example: 10.762622
                longitude:
                  type: number
                  format: double
                  example: 106.660172
              required:
                - missionId
                - latitude
                - longitude
      responses:
        "200":
          description: Position sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - not assigned team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/resources:
    get:
      tags:
        - Resources
      summary: List resources
      description: Get list of vehicles and equipment (Manager/Coordinator only)
      operationId: listResources
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resources retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Resources
      summary: Create resource
      description: Add new vehicle or equipment (Manager only)
      operationId: createResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Rescue Boat #1"
                type:
                  type: string
                  enum:
                    - Boat
                    - Truck
                    - Ambulance
                    - Helicopter
                    - Equipment
                  example: "Boat"
                capacity:
                  type: integer
                  example: 10
              required:
                - name
                - type
      responses:
        "201":
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  resourceId:
                    type: string
                    example: "60d5ec49f1b2c8b1f8e4e1a6"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/resources/{id}:
    patch:
      tags:
        - Resources
      summary: Update resource
      description: Update resource status (Manager only)
      operationId: updateResource
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Resource ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - Available
                    - In Use
                    - Maintenance
                    - Unavailable
              required:
                - status
      responses:
        "200":
          description: Resource updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/supplies:
    get:
      tags:
        - Inventory
      summary: List relief supplies
      description: Get list of relief supplies inventory (Manager only)
      operationId: listSupplies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Supplies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supply"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/inventory/{id}:
    patch:
      tags:
        - Inventory
      summary: Update inventory
      description: Update inventory quantity (Manager only)
      operationId: updateInventory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Inventory item ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
