                supplyId:
                  type: string
                  example: "60d5ec49f1b2c8b1f8e4e1a7"
                quantity:
                  type: integer
                  example: 50
              required:
                - missionId
                - supplyId
                - quantity
      responses:
        "200":
          description: Supplies distributed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        "400":
          description: Invalid input or insufficient inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/notifications:
