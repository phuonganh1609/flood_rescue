<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Test - Flood Rescue</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        color: #00d9ff;
      }
      .section {
        background: #16213e;
        padding: 20px;
        border-radius: 10px;
        margin: 15px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #aaa;
      }
      input,
      textarea {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #0f3460;
        color: #fff;
        margin-bottom: 15px;
      }
      button {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-right: 10px;
      }
      .btn-connect {
        background: #00d9ff;
        color: #000;
      }
      .btn-disconnect {
        background: #ff6b6b;
        color: #fff;
      }
      .btn-test {
        background: #4ade80;
        color: #000;
      }
      .status {
        padding: 10px 15px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: bold;
      }
      .status.connected {
        background: #22c55e33;
        color: #4ade80;
        border: 1px solid #4ade80;
      }
      .status.disconnected {
        background: #ef444433;
        color: #f87171;
        border: 1px solid #f87171;
      }
      .status.error {
        background: #f59e0b33;
        color: #fbbf24;
        border: 1px solid #fbbf24;
      }
      #log {
        background: #0a0a1a;
        padding: 15px;
        border-radius: 6px;
        height: 300px;
        overflow-y: auto;
        font-family: "Consolas", monospace;
        font-size: 13px;
      }
      .log-entry {
        padding: 5px 0;
        border-bottom: 1px solid #333;
      }
      .log-entry.notification {
        color: #4ade80;
      }
      .log-entry.error {
        color: #f87171;
      }
      .log-entry.info {
        color: #60a5fa;
      }
      .log-entry.event {
        color: #c084fc;
      }
    </style>
  </head>
  <body>
    <h1>🔌 WebSocket Test - Flood Rescue</h1>

    <div class="section">
      <h3>1. Nhập JWT Token</h3>
      <label>JWT Token (lấy từ response sau khi login):</label>
      <textarea
        id="token"
        rows="3"
        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      ></textarea>

      <label>Server URL:</label>
      <input type="text" id="serverUrl" value="http://localhost:8080" />

      <button class="btn-connect" onclick="connect()">🔗 Connect</button>
      <button class="btn-disconnect" onclick="disconnect()">
        ❌ Disconnect
      </button>
    </div>

    <div class="section">
      <h3>2. Connection Status</h3>
      <div id="status" class="status disconnected">⚪ Disconnected</div>
      <div
        id="userInfo"
        style="display: none; margin-top: 10px; color: #aaa"
      ></div>
    </div>

    <div class="section">
      <h3>3. Test Events</h3>
      <button class="btn-test" onclick="testPing()">📡 Ping Server</button>
      <p style="color: #888; font-size: 13px">
        Các events sẽ tự động được log khi có notification mới từ server
      </p>
    </div>

    <div class="section">
      <h3>4. Event Log</h3>
      <button
        onclick="clearLog()"
        style="background: #666; color: #fff; margin-bottom: 10px"
      >
        🗑️ Clear Log
      </button>
      <div id="log"></div>
    </div>

    <script>
      let socket = null;

      function log(message, type = "info") {
        const logDiv = document.getElementById("log");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span style="color:#888">[${new Date().toLocaleTimeString()}]</span> ${message}`;
        logDiv.insertBefore(entry, logDiv.firstChild);
      }

      function clearLog() {
        document.getElementById("log").innerHTML = "";
      }

      function setStatus(text, type) {
        const statusDiv = document.getElementById("status");
        statusDiv.textContent = text;
        statusDiv.className = `status ${type}`;
      }

      function connect() {
        const token = document.getElementById("token").value.trim();
        const serverUrl = document.getElementById("serverUrl").value.trim();

        if (!token) {
          alert("Vui lòng nhập JWT token!");
          return;
        }

        if (socket) {
          socket.disconnect();
        }

        log(`Connecting to ${serverUrl}...`, "info");

        socket = io(serverUrl, {
          auth: { token },
          transports: ["websocket", "polling"],
        });

        // Connection events
        socket.on("connect", () => {
          setStatus(`🟢 Connected (ID: ${socket.id})`, "connected");
          log(`✅ Connected with socket ID: ${socket.id}`, "notification");
        });

        socket.on("disconnect", (reason) => {
          setStatus("🔴 Disconnected", "disconnected");
          log(`❌ Disconnected: ${reason}`, "error");
          document.getElementById("userInfo").style.display = "none";
        });

        socket.on("connect_error", (err) => {
          setStatus(`⚠️ Connection Error`, "error");
          log(`❌ Connection error: ${err.message}`, "error");
        });

        // Server events
        socket.on("CONNECTED", (data) => {
          log(
            `📋 Server acknowledged: User ${data.userId} | Role: ${data.userRole}`,
            "event",
          );
          document.getElementById("userInfo").innerHTML =
            `<strong>User ID:</strong> ${data.userId} | <strong>Role:</strong> ${data.userRole}`;
          document.getElementById("userInfo").style.display = "block";
        });

        // Notification events
        socket.on("NEW_NOTIFICATION", (data) => {
          log(
            `🔔 NEW_NOTIFICATION: ${JSON.stringify(data, null, 2)}`,
            "notification",
          );
        });

        socket.on("UNREAD_COUNT_UPDATE", (data) => {
          log(
            `🔢 UNREAD_COUNT_UPDATE: ${data.unreadCount} unread notifications`,
            "event",
          );
        });

        socket.on("REQUEST_SUBMITTED", (data) => {
          log(`🚨 REQUEST_SUBMITTED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("REQUEST_REJECTED", (data) => {
          log(`❌ REQUEST_REJECTED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("MISSION_ASSIGNED", (data) => {
          log(`📋 MISSION_ASSIGNED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("MISSION_ACCEPTED", (data) => {
          log(`👍 MISSION_ACCEPTED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("MISSION_APPROACHING", (data) => {
          log(
            `🚗 MISSION_APPROACHING: ${JSON.stringify(data)}`,
            "notification",
          );
        });

        socket.on("MISSION_COMPLETED", (data) => {
          log(`🎉 MISSION_COMPLETED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("MISSION_FAILED", (data) => {
          log(`⚠️ MISSION_FAILED: ${JSON.stringify(data)}`, "notification");
        });

        socket.on("MISSION_REASSIGNED", (data) => {
          log(`🔄 MISSION_REASSIGNED: ${JSON.stringify(data)}`, "notification");
        });
      }

      function disconnect() {
        if (socket) {
          socket.disconnect();
          socket = null;
        }
      }

      function testPing() {
        if (!socket || !socket.connected) {
          log("❌ Not connected! Please connect first.", "error");
          return;
        }
        log("📡 Sending ping...", "info");
        // Socket.io has built-in ping/pong, this just logs connection state
        log(
          `📡 Socket connected: ${socket.connected}, ID: ${socket.id}`,
          "info",
        );
      }
    </script>
  </body>
</html>
